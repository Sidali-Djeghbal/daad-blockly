name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (${{ matrix.platform }} / ${{ matrix.arch }})
        run: npm run dist:${{ matrix.platform }} -- --publish never --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daad-blockly-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: daad-blockly-*
          merge-multiple: true
          path: dist

      - name: Display structure
        run: ls -laR

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: لغة ضاد ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          draft: true
          prerelease: false