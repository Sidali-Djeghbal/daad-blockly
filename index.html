<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#21ad77" />
  <meta name="description" content="لغة ضاد - بيئة تعلم برمجة بصرية بلغة عربية" />
  <title>لغة ضاد</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <header class="topbar" role="banner">
    <strong>لغة ضاد</strong>
    <div class="user-info">
      <span class="muted" id="fileInfo" aria-label="اسم الملف الحالي"> workspace.json </span>
      <button id="saveBtn" class="btn btn-secondary" type="button" accesskey="s" title="حفظ (Alt+S)">حفظ</button>
      <button id="saveAsBtn" class="btn btn-secondary" type="button" title="حفظ باسم">حفظ باسم</button>
      <button id="openBtn" class="btn btn-secondary" type="button" accesskey="o" title="فتح (Alt+O)">فتح</button>
      <div class="dropdown" id="examplesDropdown">
        <button id="examplesBtn" class="btn btn-secondary" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="examplesMenu" title="أمثلة">أمثلة ▼</button>
        <div class="dropdown-menu" id="examplesMenu" role="menu" aria-label="قائمة الأمثلة">
          <button class="dropdown-item" data-example="hello" role="menuitem">مرحباً بالعالم</button>
          <button class="dropdown-item" data-example="input" role="menuitem">المدخلات</button>
          <button class="dropdown-item" data-example="grades" role="menuitem">الدرجات</button>
          <button class="dropdown-item" data-example="counting" role="menuitem">العد</button>
          <button class="dropdown-item" data-example="lists" role="menuitem">القوائم</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <section class="blockly-section" aria-label="منطقة البرمجة البصرية">
      <div id="blocklyDiv" role="application"></div>
    </section>
    <section class="workspace-section" aria-label="منطقة التشغيل">
      <div class="workspace-header row space-between">
        <h2>المحاكاة</h2>
        <span id="saveStatus" class="muted"></span>
      </div>
      <div class="row">
        <button id="runBtn" class="btn" type="button" accesskey="r" title="تشغيل (Alt+R)">تشغيل</button>
        <div class="btn-group" role="group" aria-label="تراجع وإعادة">
          <button id="undoBtn" class="btn btn-secondary btn-small" type="button" title="تراجع (Ctrl+Z)">↩ تراجع</button>
          <button id="redoBtn" class="btn btn-secondary btn-small" type="button" title="إعادة (Ctrl+Y)">↪ إعادة</button>
        </div>
      </div>
      <div id="errorIndicator" class="error-indicator" style="display:none" role="alert" aria-live="assertive"></div>
      <div class="workspace-split">
        <div class="code-area">
          <h3>كود</h3>
          <textarea id="codeBox" dir="ltr" spellcheck="false" readonly aria-label="الكود المولد"></textarea>
        </div>
        <div class="output-area">
          <h3>مخرجات</h3>
          <pre id="outBox" class="output" aria-label="مخرجات التنفيذ" aria-live="polite"></pre>
        </div>
        <div class="input-area" id="inputArea">
          <h3>إدخال</h3>
          <div class="input-row">
            <textarea id="inputBox" dir="ltr" spellcheck="false" placeholder="اكتب المدخلات هنا..." aria-label="حقل الإدخال"></textarea>
            <button id="sendInputBtn" class="btn btn-small btn-secondary" type="button" disabled aria-label="إرسال المدخلات">إرسال</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="node_modules/blockly/blockly_compressed.js"></script>
  <script src="node_modules/blockly/msg/ar.js"></script>
  <script src="node_modules/blockly/blocks_compressed.js"></script>
  <script src="assets/js/blocks/custom.js"></script>
  <script src="assets/js/blocks/toolbox.js"></script>
  <script src="assets/js/generator/index.js"></script>
  <script src="assets/js/app/logic.js"></script>
  <script src="assets/js/examples.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
