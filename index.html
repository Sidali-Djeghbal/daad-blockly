<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لغة ضاد</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <header class="topbar">
    <strong>لغة ضاد</strong>
    <div class="user-info">
      <span class="muted" id="fileInfo"> workspace.json </span>
      <button id="saveBtn" class="btn btn-secondary">حفظ</button>
      <button id="saveAsBtn" class="btn btn-secondary">حفظ باسم</button>
      <button id="openBtn" class="btn btn-secondary">فتح</button>
    </div>
  </header>

  <main class="main-container">
    <section class="blockly-section">
      <div id="blocklyDiv"></div>
    </section>
    <section class="workspace-section">
      <div class="workspace-header row space-between">
        <h2>المحاكاة</h2>
        <span id="saveStatus" class="muted"></span>
      </div>
      <button id="runBtn" class="btn">تشغيل</button>
      <div id="errorIndicator" class="error-indicator" style="display:none"></div>
      <div class="workspace-split">
        <div class="code-area">
          <h3>كود</h3>
          <textarea id="codeBox"></textarea>
        </div>
        <div class="output-area">
          <h3>مخرجات</h3>
          <pre id="outBox" class="output"></pre>
        </div>
      </div>
    </section>
  </main>

  <script src="node_modules/blockly/blockly_compressed.js"></script>
  <script src="node_modules/blockly/msg/ar.js"></script>
  <script src="node_modules/blockly/blocks_compressed.js"></script>
  <script src="assets/js/blocks/custom.js"></script>
  <script src="assets/js/blocks/toolbox.js"></script>
  <script src="assets/js/generator/index.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
